name: Test

on:
  push:
  pull_request:
    branches: [main]
  # Claudinite's maintenance PR is pushed by GITHUB_TOKEN, and this repo parks the
  # resulting `pull_request` run at `action_required` — created, never executed,
  # waiting on an approval nobody clicks. The update flow's deliver() works around
  # that by DISPATCHING the workflows a PR would have run, which needs this trigger:
  # without it the maintenance PR has no green to stand on and is closed and re-cut
  # every cycle instead of landing.
  workflow_dispatch:

jobs:
  verify:
    name: Tests + requirements trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # npm test + npm run trace: every Active requirement in dev/docs/REQUIREMENTS.md
      # must be covered by a test or a manual-test item (REQ-NFR-006).
      - name: Verify (tests + trace)
        run: npm run verify

      - name: Version records agree (manifest ↔ package)
        run: |
          node -e "
            const m = require('./extension/manifest.json');
            const p = require('./package.json');
            if (m.version !== p.version) {
              console.error('extension/manifest.json is', m.version, 'but package.json is', p.version);
              process.exit(1);
            }
            console.log('version', m.version);
          "

      - name: Build compiles
        run: npm run build
      # Claudinite's checks; the engine update keeps these steps current.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/claudinite
            ~/.npm/_cacache
          key: cn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.claudinite/settings.yaml') }}
          restore-keys: cn-${{ runner.os }}-${{ runner.arch }}-
      - name: install the engine settings.yaml pins
        run: npx --yes --prefer-offline @claudinite/setup@1.0.1
      - name: name the Claudinite checks build
        id: claudinite-checks
        continue-on-error: true
        run: .claudinite/bin/cn check key >> "$GITHUB_OUTPUT"
      - if: steps.claudinite-checks.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.claudinite-checks.outputs.dir }}
          key: claudinite-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.claudinite-checks.outputs.key }}
      - name: cn check work-and-world
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .claudinite/bin/cn check work-and-world
