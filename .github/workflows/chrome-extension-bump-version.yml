name: "Chrome extension: Bump version (reusable)"

# The DELIBERATE version bump, vendored from the chrome-extension pack into the
# repo's own .github/. workflow_call ONLY — the `chrome-extension-release.yml`
# orchestrator owns the trigger.
#
# This is the pipeline's ONLY write to a version, and it is never automatic. The
# routine patch belongs to the change that earned it: a PR touching a shipped
# file raises it in the same PR, and `cer/version-bumped` is what holds that
# line. What is left over is the statement that belongs to no single change —
# "this is a new feature set" (minor) or "this is a new extension" (major) — so a
# human dispatches it here.
#
# The bump is pushed to main with GITHUB_TOKEN, which fires no workflow — hence
# the orchestrator running the package leg explicitly after this rather than
# relying on the push trigger.
#
# The caller must grant `permissions: contents: write`.
on:
  workflow_call:
    inputs:
      part:
        description: "Which part to raise — minor or major"
        required: true
        type: string
    outputs:
      version:
        description: The version after the bump
        value: ${{ jobs.bump.outputs.version }}
      sha:
        description: The commit the bump landed as
        value: ${{ jobs.bump.outputs.sha }}

defaults:
  run:
    shell: bash

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch tip as of now. If main moves before the push below it
          # fails non-fast-forward — a loud red, and nothing has been released
          # off a half-written version.
          ref: main

      - id: cfg
        uses: ./.github/actions/read-release-config

      - id: bump
        uses: ./.github/actions/bump-extension-patch
        with:
          manifest_path: ${{ steps.cfg.outputs.manifest_path }}
          package_json_path: ${{ steps.cfg.outputs.package_json_path }}
          part: ${{ inputs.part }}

      - name: Push the bump to main
        id: push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Bumped to v${{ steps.bump.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
